[project]
name = "clashstore-analyzer"
version = "0.1.0"
description = "Analysiert Clash Royale Shop-Screenshots per Computer Vision und berechnet Gold-Preise."
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.0.0",
    "pytesseract>=0.3.13",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "ruff>=0.16.0",
    "interrogate>=1.5.0",
    "pytest>=9.0",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, isort

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.interrogate]
fail-under = 20
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests", "main.py", "CvMethods.py"]
pythonpath = ["."]
addopts = "--doctest-modules"
